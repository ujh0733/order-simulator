<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 배달 플랫폼 관리자</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
            background: #f4f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 320px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 1.5rem;
            text-align: center;
            color: #1b1f27;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            color: #555;
        }
        input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #dfe2e8;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: #2d6cdf;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #2d6cdf;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #2557b8; }
        .error {
            background: #fdecea;
            color: #c0392b;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>배달 플랫폼 관리자</h1>
    <p class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
</div>
</body>
</html>
