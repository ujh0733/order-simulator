spring:
  application:
    name: order-simulator

  datasource:
    url: jdbc:mysql://localhost:3306/order_simulator?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: app
    password: app
    hikari:
      # 스케줄러 2개(부하 생성, 주문 처리) + 웹 요청이 커넥션을 나눠 쓰다 보니
      # 기본값(10)에서는 대기가 생겼다. 여유를 좀 더 둔다.
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

  web:
    resources:
      cache:
        period: 0

  task:
    scheduling:
      pool:
        size: 2

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

seoul-api:
logging:
  level:
    org.hibernate.SQL: warn
